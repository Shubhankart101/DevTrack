<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DevTrack | Pipeline Status</title>
  <style>
    :root {
      --bg: #0c1420;
      --panel: #152235;
      --panel-strong: #1c2c43;
      --line: #30435e;
      --text: #edf4fb;
      --muted: #9aabc0;
      --blue: #63b3ed;
      --green: #78d89a;
      --yellow: #f2cb67;
      --red: #ff8178;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background: radial-gradient(circle at top right, #1c3350 0, var(--bg) 42%);
      font: 16px/1.5 "Segoe UI", sans-serif;
    }
    main { width: min(1120px, calc(100% - 32px)); margin: 0 auto; padding: 48px 0 72px; }
    header { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 28px; }
    h1 { margin: 0; font-size: clamp(2.3rem, 7vw, 5rem); line-height: .95; letter-spacing: -.05em; }
    .subtitle { max-width: 650px; margin: 14px 0 0; color: var(--muted); }
    .live { color: var(--green); font: 700 .78rem monospace; letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; }
    .live::before { content: ""; display: inline-block; width: 9px; height: 9px; margin-right: 8px; border-radius: 50%; background: currentColor; box-shadow: 0 0 0 5px #78d89a24; }
    .controls, .summary { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .controls { margin-bottom: 16px; }
    input, button { border: 1px solid var(--line); border-radius: 8px; color: var(--text); background: var(--panel); font: inherit; }
    input { width: min(360px, 100%); padding: 10px 12px; }
    button { padding: 10px 14px; cursor: pointer; }
    button:hover { border-color: var(--blue); background: var(--panel-strong); }
    .status-filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
    .status-filter.active { border-color: var(--blue); color: var(--text); background: #203654; }
    .summary { margin-bottom: 18px; }
    .chip { padding: 7px 12px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); background: #111d2d; }
    .chip strong { color: var(--text); }
    .reactions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 22px; }
    .reaction { overflow: hidden; border: 1px solid var(--line); border-radius: 12px; background: #111d2d; }
    .reaction img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; }
    .reaction p { margin: 0; padding: 9px 10px; color: var(--muted); font-size: .82rem; }
    .runs { display: grid; gap: 12px; }
    .run { display: grid; grid-template-columns: 13px minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 18px; border: 1px solid var(--line); border-radius: 12px; background: #152235dd; }
    .run-gif { display: block; width: 112px; height: 64px; margin-bottom: 10px; border-radius: 7px; object-fit: cover; }
    .dot { width: 13px; height: 13px; border-radius: 50%; background: var(--muted); }
    .dot.success { background: var(--green); }
    .dot.failure { background: var(--red); }
    .dot.pending { background: var(--yellow); }
    .name { margin: 0; font-weight: 700; }
    .name a { color: var(--text); text-decoration: none; }
    .name a:hover { color: var(--blue); }
    .run-link { display: inline-block; margin-top: 8px; color: var(--blue); font-size: .85rem; }
    .run-toggle { display: block; width: 100%; padding: 0; border: 0; text-align: left; background: transparent; }
    .run-toggle:focus-visible { outline: 2px solid var(--blue); outline-offset: 4px; }
    .run-details { grid-column: 2 / -1; padding-top: 14px; border-top: 1px solid var(--line); }
    .stage-list { display: grid; gap: 7px; margin: 0; padding: 0; list-style: none; }
    .stage { display: flex; justify-content: space-between; gap: 16px; padding: 8px 10px; border-radius: 6px; background: #111d2d; font-size: .88rem; }
    .stage-name { color: var(--text); }
    .stage-state { color: var(--muted); font: 700 .74rem monospace; text-transform: uppercase; }
    .stage-state.success { color: var(--green); }
    .stage-state.failure { color: var(--red); }
    .stage-state.pending { color: var(--yellow); }
    .failure-note { margin: 0 0 10px; color: var(--red); font-weight: 700; }
    .details-note { margin: 10px 0 0; color: var(--muted); font-size: .84rem; }
    .meta { margin: 5px 0 0; color: var(--muted); font-size: .9rem; }
    .state { color: var(--muted); font: 700 .78rem monospace; text-transform: uppercase; }
    .empty, .error { padding: 28px; border: 1px dashed var(--line); border-radius: 12px; color: var(--muted); }
    .error { color: var(--red); }
    small { color: var(--muted); }
    @media (max-width: 680px) {
      header { display: block; }
      .live { display: block; margin-top: 22px; }
      .reactions { grid-template-columns: repeat(2, 1fr); }
      .run { grid-template-columns: 13px minmax(0, 1fr); }
      .state { grid-column: 2; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Pipeline status</h1>
        <p class="subtitle">A live view of GitHub Actions runs for DevTrack. No Django server required.</p>
      </div>
      <div class="live">Live polling</div>
    </header>

    <form id="controls" class="controls">
      <label for="repository">Repository</label>
      <input id="repository" value="Shubhankart101/DevTrack" pattern="[^/\\s]+/[^/\\s]+" aria-label="GitHub repository in owner slash repository format">
      <label for="branch">Branch</label>
      <input id="branch" placeholder="all branches" aria-label="Optional GitHub branch filter">
      <button type="submit">Refresh runs</button>
    </form>

    <nav class="status-filters" aria-label="Pipeline status filters">
      <button type="button" class="status-filter" data-status-filter="all">All runs</button>
      <button type="button" class="status-filter" data-status-filter="failure">Failed</button>
      <button type="button" class="status-filter" data-status-filter="running">Running</button>
      <button type="button" class="status-filter" data-status-filter="success">Succeeded</button>
    </nav>

    <section id="summary" class="summary" aria-live="polite"></section>
    <section id="runs" class="runs" aria-live="polite"><div class="empty">Connecting to GitHub Actions...</div></section>
    <section class="reactions" aria-label="Pipeline reactions">
      <article class="reaction"><img src="assets/eyebrow-raise-dwight.gif" alt="Dwight raises an eyebrow"><p>Reviewing the diff</p></article>
      <article class="reaction"><img src="assets/crazy-dance-funny-dance.gif" alt="Celebrating a deployment"><p>Deployment celebration</p></article>
      <article class="reaction"><img src="assets/hell-yeah-yeah.gif" alt="Celebrating a successful result"><p>Green build energy</p></article>
      <article class="reaction"><img src="assets/tired-office.gif" alt="Tired after debugging"><p>After the long debug</p></article>
      <article class="reaction"><img src="assets/atg-studiocapa.gif" alt="Pipeline momentum"><p>Momentum restored</p></article>
      <article class="reaction"><img src="assets/pond-naravit-ppnaravit.gif" alt="Surprised pipeline reaction"><p>Unexpected result</p></article>
      <article class="reaction"><img src="assets/the-office-the-office-memes.gif" alt="Office reaction meme"><p>Team reaction</p></article>
      <article class="reaction"><img src="assets/thats-what-she-said-what-she-said.gif" alt="Office response reaction"><p>Pipeline banter</p></article>
    </section>
  </main>

  <script>
    const repositoryInput = document.getElementById('repository');
    const branchInput = document.getElementById('branch');
    const controls = document.getElementById('controls');
    const summary = document.getElementById('summary');
    const runs = document.getElementById('runs');
    const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[character]));
    const formatDate = (value) => value ? new Date(value).toLocaleString() : 'Not started';
    const stateLabel = (run) => run.status === 'completed' ? (run.conclusion || 'completed') : run.status;
    const stateClass = (state) => state === 'success' ? 'success' : ['failure', 'cancelled', 'timed_out'].includes(state) ? 'failure' : 'pending';
    const stateGif = (state) => state === 'success' ? 'assets/great-job.gif' : ['failure', 'cancelled', 'timed_out'].includes(state) ? 'assets/office.gif' : 'assets/bounce-dwight.gif';
    const params = new URLSearchParams(window.location.search);
    let activeFilter = params.get('status') || 'all';
    let latestPayload = null;
    repositoryInput.value = params.get('repo') || repositoryInput.value;
    branchInput.value = params.get('branch') || '';

    const matchesFilter = (run, filter) => {
      const state = stateLabel(run);
      if (filter === 'running') return run.status === 'in_progress';
      if (filter === 'success') return state === 'success';
      if (filter === 'failure') return ['failure', 'cancelled', 'timed_out'].includes(state);
      return true;
    };

    function render(payload) {
      latestPayload = payload;
      const items = payload.workflow_runs || [];
      const filteredItems = items.filter((item) => matchesFilter(item, activeFilter));
      const counts = items.reduce((result, item) => {
        const state = stateLabel(item);
        result[state] = (result[state] || 0) + 1;
        return result;
      }, {});
      const branchLabel = payload.branch || 'all branches';
      summary.innerHTML = `<span class="chip"><strong>${filteredItems.length}</strong> ${activeFilter === 'all' ? 'recent runs' : `${escapeHtml(activeFilter)} runs`}</span><span class="chip"><strong>${counts.in_progress || 0}</strong> running</span><span class="chip"><strong>${counts.success || 0}</strong> passed</span><span class="chip"><strong>${counts.failure || 0}</strong> failed</span><span class="chip">Branch <strong>${escapeHtml(branchLabel)}</strong></span><span class="chip">Updated <strong>${escapeHtml(formatDate(payload.fetched_at))}</strong></span>`;
      if (!filteredItems.length) {
        runs.innerHTML = `<div class="empty">No ${activeFilter === 'all' ? '' : `${escapeHtml(activeFilter)} `}workflow runs found for this repository.</div>`;
        return;
      }
      runs.innerHTML = filteredItems.map((run) => {
        const state = stateLabel(run);
        return `<article class="run"><span class="dot ${stateClass(state)}"></span><div><img class="run-gif" src="${stateGif(state)}" alt="${escapeHtml(state)} pipeline reaction"><button type="button" class="run-toggle" data-run-id="${escapeHtml(run.id)}" aria-expanded="false"><p class="name">${escapeHtml(run.name)}</p><p class="meta">Run #${escapeHtml(run.run_number)} · ${escapeHtml(run.head_branch || 'unknown branch')} · ${escapeHtml(run.actor?.login || 'unknown actor')} · ${escapeHtml(formatDate(run.created_at))}</p></button><a class="run-link" href="${escapeHtml(run.html_url)}" target="_blank" rel="noreferrer">Open GitHub run &#8599;</a></div><span class="state">${escapeHtml(state)}</span><div class="run-details" data-details-for="${escapeHtml(run.id)}" hidden></div></article>`;
      }).join('');
    }

    document.querySelectorAll('.status-filter').forEach((filterButton) => {
      filterButton.classList.toggle('active', filterButton.dataset.statusFilter === activeFilter);
      filterButton.addEventListener('click', () => {
        activeFilter = filterButton.dataset.statusFilter;
        const nextParams = new URLSearchParams(window.location.search);
        nextParams.set('status', activeFilter);
        window.history.replaceState({}, '', `${window.location.pathname}?${nextParams}`);
        document.querySelectorAll('.status-filter').forEach((button) => button.classList.toggle('active', button === filterButton));
        if (latestPayload) render(latestPayload);
      });
    });

    const jobState = (job) => job.conclusion || job.status || 'unknown';
    const stageClass = (state) => state === 'success' ? 'success' : ['failure', 'cancelled', 'timed_out'].includes(state) ? 'failure' : 'pending';

    async function expandRun(runId, toggle) {
      const details = document.querySelector(`[data-details-for="${CSS.escape(runId)}"]`);
      if (!details) return;
      const isOpen = !details.hidden;
      details.hidden = isOpen;
      toggle.setAttribute('aria-expanded', String(!isOpen));
      if (isOpen || details.dataset.loaded === 'true') return;
      details.hidden = false;
      details.innerHTML = '<p class="details-note">Loading job stages...</p>';
      const run = (latestPayload?.workflow_runs || []).find((item) => String(item.id) === String(runId));
      if (!run) return;
      try {
        const repository = repositoryInput.value.trim().split('/');
        const jobsUrl = `https://api.github.com/repos/${encodeURIComponent(repository[0])}/${encodeURIComponent(repository[1])}/actions/runs/${encodeURIComponent(runId)}/jobs?per_page=100`;
        const response = await fetch(jobsUrl, { headers: { Accept: 'application/vnd.github+json' } });
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.message || `GitHub API returned ${response.status}`);
        const jobs = payload.jobs || [];
        const failedJob = jobs.find((job) => ['failure', 'cancelled', 'timed_out'].includes(jobState(job)) || (job.steps || []).some((step) => step.conclusion === 'failure'));
        const failedStep = failedJob?.steps?.find((step) => step.conclusion === 'failure');
        const failureNote = failedStep ? `<p class="failure-note">Failed stage: ${escapeHtml(failedJob.name)} / ${escapeHtml(failedStep.name)}</p>` : '';
        const stages = jobs.flatMap((job) => (job.steps || []).map((step) => ({ name: `${job.name} / ${step.name}`, state: step.conclusion || step.status || 'unknown' })));
        const fallbackStages = jobs.map((job) => ({ name: job.name, state: jobState(job) }));
        const renderedStages = (stages.length ? stages : fallbackStages).map((stage) => `<li class="stage"><span class="stage-name">${escapeHtml(stage.name)}</span><span class="stage-state ${stageClass(stage.state)}">${escapeHtml(stage.state)}</span></li>`).join('');
        details.innerHTML = `${failureNote}<ul class="stage-list">${renderedStages || '<li class="stage"><span class="stage-name">No job stages returned</span><span class="stage-state pending">unknown</span></li>'}</ul><p class="details-note">Stage status comes from GitHub Actions. <a href="${escapeHtml(run.html_url)}" target="_blank" rel="noreferrer">Open the full GitHub log &#8599;</a></p>`;
        details.dataset.loaded = 'true';
      } catch (error) {
        details.innerHTML = `<p class="details-note">${escapeHtml(error.message)} <a href="${escapeHtml(run.html_url)}" target="_blank" rel="noreferrer">Open the full GitHub log &#8599;</a></p>`;
      }
    }

    runs.addEventListener('click', (event) => {
      const toggle = event.target.closest('.run-toggle');
      if (toggle) expandRun(toggle.dataset.runId, toggle);
    });

    async function loadRuns() {
      const repository = repositoryInput.value.trim();
      const branch = branchInput.value.trim();
      if (!/^[^/\s]+\/[^/\s]+$/.test(repository)) {
        runs.innerHTML = '<div class="error">Use the owner/repository format.</div>';
        return;
      }
      try {
        const branchQuery = branch ? `&branch=${encodeURIComponent(branch)}` : '';
        const response = await fetch(`https://api.github.com/repos/${encodeURIComponent(repository.split('/')[0])}/${encodeURIComponent(repository.split('/')[1])}/actions/runs?per_page=20${branchQuery}`, { headers: { Accept: 'application/vnd.github+json' } });
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.message || `GitHub API returned ${response.status}`);
        payload.fetched_at = new Date().toISOString();
        payload.branch = branch;
        render(payload);
      } catch (error) {
        runs.innerHTML = `<div class="error">${escapeHtml(error.message)}<br><small>The repository must be public when this board is used without a server-side token.</small></div>`;
      }
    }

    controls.addEventListener('submit', (event) => {
      event.preventDefault();
      const nextParams = new URLSearchParams();
      nextParams.set('repo', repositoryInput.value.trim());
      if (branchInput.value.trim()) nextParams.set('branch', branchInput.value.trim());
      window.history.replaceState({}, '', `${window.location.pathname}?${nextParams}`);
      loadRuns();
    });
    loadRuns();
    setInterval(loadRuns, 15000);
  </script>
</body>
</html>
