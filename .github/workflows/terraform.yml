name: Terraform Template

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment name
        required: true
        type: string
      terraform_action:
        description: Terraform action to run
        required: true
        type: string
      working_directory:
        description: Terraform root directory
        required: true
        type: string
      app_name:
        description: Azure Web App name override
        required: false
        default: ''
        type: string
      python_version:
        description: Python runtime version override
        required: false
        default: '3.12'
        type: string
      provision_runner:
        description: Whether to provision the self-hosted runner infra
        required: false
        default: false
        type: boolean

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}

    env:
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Export Terraform variables
        shell: bash
        run: |
          echo "TF_VAR_subscription_id=${ARM_SUBSCRIPTION_ID}" >> "$GITHUB_ENV"
          echo "TF_VAR_tenant_id=${ARM_TENANT_ID}" >> "$GITHUB_ENV"
          echo "TF_VAR_python_version=${{ inputs.python_version }}" >> "$GITHUB_ENV"
          echo "TF_VAR_github_repository=${GITHUB_REPOSITORY}" >> "$GITHUB_ENV"

          if [ -n "${{ inputs.app_name }}" ]; then
            echo "TF_VAR_app_name=${{ inputs.app_name }}" >> "$GITHUB_ENV"
          elif [ -n "${{ secrets.AZURE_WEBAPP_NAME }}" ]; then
            echo "TF_VAR_app_name=${{ secrets.AZURE_WEBAPP_NAME }}" >> "$GITHUB_ENV"
          fi

          if [ -n "${{ secrets.AZURE_RUNNER_SSH_PUBLIC_KEY }}" ]; then
            echo "TF_VAR_admin_ssh_public_key=${{ secrets.AZURE_RUNNER_SSH_PUBLIC_KEY }}" >> "$GITHUB_ENV"
          fi

      - name: Create GitHub runner registration token
        if: ${{ inputs.provision_runner }}
        shell: bash
        env:
          GH_RUNNER_ADMIN_TOKEN: ${{ secrets.GH_RUNNER_ADMIN_TOKEN }}
        run: |
          if [ -z "$GH_RUNNER_ADMIN_TOKEN" ]; then
            echo "GH_RUNNER_ADMIN_TOKEN secret is required to provision the runner." >&2
            exit 1
          fi

          response=$(curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_RUNNER_ADMIN_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runners/registration-token")

          runner_token=$(printf '%s' "$response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          echo "::add-mask::${runner_token}"
          echo "TF_VAR_github_runner_registration_token=${runner_token}" >> "$GITHUB_ENV"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        shell: bash
        run: |
          if [ "${{ inputs.terraform_action }}" = "apply" ]; then
            terraform plan -out=tfplan
          else
            terraform plan
          fi

      - name: Terraform Apply
        if: ${{ inputs.terraform_action == 'apply' }}
        run: terraform apply -auto-approve tfplan
