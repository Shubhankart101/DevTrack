name: Extended Manual Tests

on:
  workflow_dispatch:
    inputs:
      python_version:
        description: Python version to use
        required: false
        default: '3.12'

permissions:
  contents: read

jobs:
  extended-tests:
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: ${{ inputs.python_version || '3.12' }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Python source
        run: python -m compileall -q devtrack

      - name: Run Django checks
        run: python devtrack/manage.py check

      - name: Run extended test scenarios
        run: python devtrack/manage.py test issues --verbosity 2