name: Build, Test, and Deploy Django App

on:
  workflow_dispatch:
    inputs:
      python_version:
        description: Python version to use
        required: false
        default: '3.12'
      app_name:
        description: Azure Web App name
        required: false
        default: ''

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: ${{ inputs.python_version || '3.12' }}
      AZURE_WEBAPP_NAME: ${{ inputs.app_name || secrets.AZURE_WEBAPP_NAME }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Python source
        run: python -m compileall -q devtrack

      - name: Run Django checks
        run: python devtrack/manage.py check

      - name: Run test cases
        run: python devtrack/manage.py test issues

      - name: Deploy to Azure Web App
        if: ${{ env.AZURE_WEBAPP_NAME != '' }}
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          package: .
