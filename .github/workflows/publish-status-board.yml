name: Publish Pipeline Status Board

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - docs/index.html
      - docs/status-board.html
      - docs/assets/**
      - .github/workflows/publish-status-board.yml

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload status board
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4