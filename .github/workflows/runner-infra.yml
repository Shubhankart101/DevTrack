name: Provision GitHub Runner Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment name
        required: true
        default: dev
      terraform_action:
        description: Terraform action to run
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply

jobs:
  runner-infra:
    uses: ./.github/workflows/terraform.yml
    with:
      environment: ${{ inputs.environment }}
      terraform_action: ${{ inputs.terraform_action }}
      working_directory: infra/terraform/runner
      provision_runner: true
    secrets: inherit