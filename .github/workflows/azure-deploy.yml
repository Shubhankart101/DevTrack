name: Provision App Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment name
        required: true
        default: dev
      terraform_action:
        description: Terraform action to run
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
      python_version:
        description: Python runtime version for the Web App
        required: false
        default: '3.12'
      app_name:
        description: Azure Web App name override
        required: false
        default: ''

jobs:
  app-infra:
    uses: ./.github/workflows/terraform.yml
    with:
      environment: ${{ inputs.environment }}
      terraform_action: ${{ inputs.terraform_action }}
      working_directory: infra/terraform
      python_version: ${{ inputs.python_version }}
      app_name: ${{ inputs.app_name }}
      provision_runner: false
    secrets: inherit
